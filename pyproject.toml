[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kora-control-plane"
version = "0.1.0"
description = "Mission and authority control plane for the Kora AI coworker"
requires-python = ">=3.11"
dependencies = [
  "agent-client-protocol==0.9.0",
]

[project.scripts]
kora-hermes-spike = "kora.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
